<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
      background: #F9FAFB;
      color: #111827;
      padding: 16px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(17, 24, 39, 0.08);
      padding: 20px;
    }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    p.sub { font-size: 12px; color: #6B7280; margin-top: 4px; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; }
    input {
      width: 100%;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #111827;
      margin-bottom: 12px;
    }
    input:focus { outline: 2px solid #4F46E5; outline-offset: 1px; border-color: #4F46E5; }
    button.primary {
      width: 100%;
      background: #4F46E5;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.08);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button.primary:hover:not(:disabled) { background: #4338CA; }
    button.primary:active:not(:disabled) { transform: scale(0.98); }
    button.primary:disabled { opacity: 0.75; cursor: wait; }
    button.primary.loading {
      background-image: linear-gradient(90deg, #4F46E5 0%, #818CF8 50%, #4F46E5 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      button.primary.loading { animation: none; }
    }
    button.link {
      width: 100%;
      background: none;
      border: none;
      color: #4F46E5;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
      cursor: pointer;
    }
    .msg {
      display: none;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 12px;
    }
    .msg.success { display: block; background: #ECFDF5; border: 1px solid #A7F3D0; color: #047857; }
    .msg.error { display: block; background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; }
    .hidden { display: none !important; }
    .hint { font-size: 11px; color: #6B7280; margin-top: 8px; line-height: 1.5; }
    code { font-size: 11px; background: #F1F5F9; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Huntern Clipper</h1>
    <p class="sub">Save this posting to your tracker.</p>

    <div id="setup-view">
      <label for="user-id">User ID</label>
      <input id="user-id" type="text" placeholder="Paste from Settings → Clipper Setup" />
      <button id="save-id" class="primary" type="button">Connect</button>
      <p class="hint">Find your ID in Huntern under <code>Settings → Clipper Setup</code>. Stored only in this browser.</p>
    </div>

    <div id="clip-view" class="hidden">
      <button id="save-job" class="primary" type="button">Save to Huntern</button>
      <button id="reset-id" class="link" type="button">Use a different account</button>
    </div>

    <p id="msg" class="msg" role="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
